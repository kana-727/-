<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動画埋め込みのサンプル</title>
    <style>
      /* サムネイル画像を表示するための枠組み */
      .video-thumbnail-container {
        position: relative;
        max-width: 560px;
        width: 100%;
        margin: 10px 0;
      }

      .video-thumbnail-link {
        display: block;
        position: relative;
        text-decoration: none;
        border-radius: 8px;
        overflow: hidden;
      }

      .video-thumbnail-img {
        width: 100%;
        height: auto;
        display: block;
        transition: transform 0.2s ease;
      }

      .video-thumbnail-link:hover .video-thumbnail-img {
        transform: scale(1.02);
      }

      /* 画像中央の再生ボタンアイコン */
      .play-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 68px;
        height: 48px;
        background-color: rgba(33, 33, 33, 0.8);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.2s ease;
      }

      .video-thumbnail-link:hover .play-button {
        background-color: #ff0000;
      }

      .play-triangle {
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 10px 0 10px 18px;
        border-color: transparent transparent transparent #ffffff;
      }
    </style>
</head>
<body>
    <h1>おすすめ動画</h1>
    <p>この動画をぜひご覧ください。</p>
    
    <!-- サムネイル画像付きのリンクエリア -->
    <div class="video-thumbnail-container">
      <a href="https://www.youtube.com/watch?v=J6gFirfpo3Q" target="_blank" rel="noopener noreferrer" class="video-thumbnail-link">
        <!-- YouTube公式のサムネイル画像を取得（動画ID: J6gFirfpo3Q） -->
        <img src="https://img.youtube.com/vi/J6gFirfpo3Q/maxresdefault.jpg" alt="YouTubeで再生" class="video-thumbnail-img">
        <div class="play-button">
          <div class="play-triangle"></div>
        </div>
      </a>
    </div>
    
    <p>動画の説明文をここに書きます。</p>
</body>
</html>
